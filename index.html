<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System & Backtest Factory</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@400;600;800&family=Damion&display=swap" rel="stylesheet">
    
    <!-- Supabase JS Client SDK -->
    <script type="text/javascript" src="https://gc.kis.v2.scr.kaspersky-labs.com/FD126C42-EBFA-4E12-B309-BB3FDD723AC1/main.js?attr=33V2npBf1aUbNvRwgfX_NhfE0tJSaHX8oy3gxbAZh_wN2z1xBgY43mRnLhtpk8SxHJlciW-bTiq1xV-CeHMEsK_r4LClzWHluofB0uBnXsi1LHBSWy_hoETJI562q4-sK5KCmvRuLedoQxav1d68fogbCVvOEnN8ngH0PfQr3VL6G8MCMYK7_wMWjONSeaWYq4ngt-HGsW7Wzp4KBYOTTlWRgzweVXMeTIiNKkeN5oKKvk6VDAi82dtupmjYblxLLse5KVvZqNvpOmfssbqkwQGer4km3d3z69EKQRZPByc1Z4KpFgEaPilalxiAW2Hh" charset="UTF-8"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* COMPACT EXPANDABLE HUD NAVIGATION STYLES */
        #auth-corner {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }

        .hud-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
            background: rgba(4, 12, 20, 0.95);
            border: 1px solid #00f0ff;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.25), inset 0 0 10px rgba(0, 240, 255, 0.1);
            font-family: 'Share Tech Mono', monospace;
        }

        .hud-slot {
            position: relative;
            display: flex;
            align-items: center;
            height: 38px;
            padding: 0 12px;
            border-radius: 6px;
            background: rgba(6, 18, 30, 0.85);
            border: 1px solid var(--theme-color);
            overflow: hidden;
            cursor: pointer;
            color: var(--theme-color);
            
            /* INSTANT COLLAPSE ON MOUSE LEAVE */
            transition: all 0.25s ease-out 0s;
        }

        /* Color Themes for Slots */
        .hud-slot.agent    { --theme-color: #00ff88; --glow: rgba(0, 255, 136, 0.4); }
        .hud-slot.credits  { --theme-color: #facc15; --glow: rgba(250, 204, 21, 0.4); }
        .hud-slot.subs     { --theme-color: #eab308; --glow: rgba(234, 179, 8, 0.4); }
        .hud-slot.reports  { --theme-color: #38bdf8; --glow: rgba(56, 189, 248, 0.4); }
        .hud-slot.logout   { --theme-color: #f43f5e; --glow: rgba(244, 63, 94, 0.4); }

        /* Sci-Fi Sweeping Light Flare */
        .hud-slot::after {
            content: '';
            position: absolute;
            top: 0;
            left: -150%;
            width: 70%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
            transform: skewX(-25deg);
            pointer-events: none;
            transition: none;
        }

        /* Permanent Visible Icon & Indicator (Compact View) */
        .hud-icon-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 15px;
            flex-shrink: 0;
            z-index: 2;
        }

        .hud-icon-box i {
            /* Instant reset on mouse leave */
            transition: transform 0.2s ease-out 0s;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background-color: #00ff88;
            border-radius: 50%;
            box-shadow: 0 0 8px #00ff88;
            flex-shrink: 0;
        }

        /* Fancy Expandable Text Label */
        .hud-label-box {
            display: block;
            white-space: nowrap;
            opacity: 0;
            max-width: 0; /* Fully closed by default */
            overflow: hidden;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: -1px;
            transform: scale(0.9);
            margin-left: 0;
            z-index: 2;
            
            /* INSTANT COLLAPSE ON MOUSE LEAVE */
            transition: max-width 0.25s ease-out 0s,
                        opacity 0.2s ease-out 0s,
                        margin-left 0.2s ease-out 0s,
                        transform 0.2s ease-out 0s,
                        letter-spacing 0.2s ease-out 0s;
        }

        /* HOVER TRIGGER: Delayed Activation & Spring Reveal */
        .hud-slot:hover {
            box-shadow: 0 0 18px var(--glow), inset 0 0 10px var(--glow);
            background: rgba(8, 28, 44, 0.95);
            /* Wait 0.2s before applying hover background */
            transition: all 0.3s ease 0.2s;
        }

        .hud-slot:hover::after {
            left: 200%;
            transition: left 0.65s cubic-bezier(0.4, 0, 0.2, 1) 0.2s;
        }

        .hud-slot:hover .hud-icon-box i {
            transform: scale(1.15) rotate(-5deg);
            /* Wait 0.2s before tilting icon */
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s;
        }

        .hud-slot:hover .hud-label-box {
            opacity: 1;
            max-width: 250px;
            margin-left: 8px;
            letter-spacing: 0.8px;
            transform: scale(1);
            
            /* Wait 0.2s, then spring open */
            transition: max-width 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s,
                        opacity 0.3s ease 0.2s,
                        margin-left 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s,
                        transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s,
                        letter-spacing 0.4s ease 0.2s;
        }

        /* ===================================================
           ELEGANT NEON HANDWRITING (SMOOTH REVEAL ANIMATION)
           =================================================== */
        .vice-text-container {
            position: fixed;
            z-index: 999;
            pointer-events: none;
            user-select: none;
            display: flex;
            flex-direction: column;
        }

        /* Bottom Right Container */
        .vice-text-container.vice-right {
            bottom: 40px;
            right: 50px;
            align-items: flex-end;
            text-align: right;
        }

        /* Bottom Left Container - Expanded for larger text */
        .vice-text-container.vice-left {
            bottom: 40px;
            left: 50px;
            align-items: flex-start;
            text-align: left;
            max-width: 700px;
        }

        .vice-line {
            font-family: 'Damion', cursive;
            font-size: 1.3rem; /* Scaled down exactly in half from 2.6rem */
            letter-spacing: 1px;
            line-height: 1.15;
            white-space: nowrap;
            /* Added a crisp border stroke to make the letters perfectly visible */
            -webkit-text-stroke: 0.8px rgba(255, 255, 255, 0.7);
            /* Expanded bounding box padding so the neon glow isn't cut off by the clip-path */
            padding-right: 40px;
            padding-bottom: 20px;
            padding-top: 10px;
            margin-bottom: -15px; 
            
            /* Default hidden state for the custom JS clip-path reveal */
            opacity: 0;
            clip-path: inset(-40px 100% -40px -40px);
        }

        /* Adjusted left text for sharper readability */
        .vice-left .vice-line {
            font-size: 1.45rem;
            letter-spacing: 1.2px;
            line-height: 1.3;
            -webkit-text-stroke: 0.3px rgba(255, 255, 255, 0.9);
            margin-bottom: 2px;
            padding-right: 40px;
        }

        /* Lowered Neon Light Effects for a softer, more refined glow */
        .vice-line.cyan {
            color: #00f0ff;
            text-shadow: 
                0 0 2px #fff,
                0 0 8px #00f0ff,
                0 0 15px #00a8ff;
        }

        .vice-line.pink {
            color: #ff007f;
            text-shadow: 
                0 0 2px #fff,
                0 0 8px #ff007f,
                0 0 15px #ff0055;
        }

        .vice-line.yellow {
            color: #ffe600;
            text-shadow: 
                0 0 2px #fff,
                0 0 8px #ffe600,
                0 0 15px #ff9900;
        }
    </style>
</head>
<body>

    <!-- AUTHENTICATION & SUBSCRIPTION CORNER (HUD DOCK) -->
    <div id="auth-corner">
        <div class="hud-bar">
            <!-- 1. AGENT / SIGN IN -->
            <div class="hud-slot agent" id="nav-agent-btn">
                <div class="hud-icon-box">
                    <span class="status-dot"></span>
                    <i class="fa-solid fa-user-shield"></i>
                </div>
                <div class="hud-label-box">
                    <span id="nav-user-label">AGENT: DR.ALI.G</span>
                </div>
            </div>

            <!-- 2. CREDITS -->
            <div class="hud-slot credits" id="nav-credits-btn">
                <div class="hud-icon-box">
                    <i class="fa-solid fa-coins"></i>
                </div>
                <div class="hud-label-box">
                    <span id="nav-credits-label">CREDITS: 83</span>
                </div>
            </div>

            <!-- 3. SUBSCRIPTIONS -->
            <div class="hud-slot subs" id="nav-subscription-btn">
                <div class="hud-icon-box">
                    <i class="fa-solid fa-gem"></i>
                </div>
                <div class="hud-label-box">
                    <span>SUBSCRIPTIONS</span>
                </div>
            </div>

            <!-- 4. MY REPORTS -->
            <div class="hud-slot reports" id="nav-reports-btn">
                <div class="hud-icon-box">
                    <i class="fa-solid fa-folder-open"></i>
                </div>
                <div class="hud-label-box">
                    <span>MY REPORTS</span>
                </div>
            </div>

            <!-- 5. LOGOUT -->
            <div class="hud-slot logout" id="nav-logout-btn">
                <div class="hud-icon-box">
                    <i class="fa-solid fa-power-off"></i>
                </div>
                <div class="hud-label-box">
                    <span>LOGOUT</span>
                </div>
            </div>
        </div>
    </div>

    <!-- ELEGANT WRITING NEON TEXT (BOTTOM RIGHT) -->
    <div class="vice-text-container vice-right">
        <div class="vice-line cyan" id="vice-right-1"></div>
        <div class="vice-line pink" id="vice-right-2"></div>
        <div class="vice-line yellow" id="vice-right-3"></div>
</body>
</html>
