<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Restrict scaling to prevent layout breaking on mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Backtest Factory | Quantitative System Evaluation</title>
    
    <!-- Google Fonts: Inter & Share Tech Mono & Caveat (for handwriting) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Share+Tech+Mono&family=Caveat:wght@700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome for standard icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="style.css">

    <!-- Supabase JS Client (v2) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- ==========================================
         TOP-RIGHT HUD (AUTHENTICATION & SUBSCRIPTIONS)
         ========================================== -->
    <div id="auth-corner">
        <div class="dock-bracket top-left"></div>
        <div class="dock-bracket bottom-right"></div>
        <div class="dock-content">
            <button id="login-btn" class="auth-btn">
                <i class="fa-solid fa-terminal"></i> LOGIN
            </button>
            <button id="signup-btn" class="auth-btn sign-up cta-btn">
                <i class="fa-solid fa-satellite-dish"></i> INITIATE UPLINK
            </button>
        </div>
    </div>

    <!-- ==========================================
         BACKGROUND MATRIX (Stars, Grid, Equations)
         ========================================== -->
    <div id="space-matrix">
        <canvas id="blackboard-bg"></canvas>
        <div class="stars"></div>
        <div class="tactical-grid"></div>
    </div>

    <!-- ==========================================
         TOP-LEFT MOTHERSHIP TITLE DISPLAY
         ========================================== -->
    <div id="spaceship-title-container">
        <!-- SVG Mothership -->
        <svg class="mothership-svg" viewBox="0 0 300 150" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="hull-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#1a2538"/>
                    <stop offset="50%" stop-color="#0a121f"/>
                    <stop offset="100%" stop-color="#03070d"/>
                </linearGradient>
                <linearGradient id="neon-glow" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8"/>
                    <stop offset="100%" stop-color="#00ff66" stop-opacity="0.2"/>
                </linearGradient>
                <filter id="thruster-blur">
                    <feGaussianBlur stdDeviation="4" result="blur" />
                    <feMerge>
                        <feMergeNode in="blur" />
                        <feMergeNode in="SourceGraphic" />
                    </feMerge>
                </filter>
            </defs>

            <!-- Main Hull Base -->
            <path d="M 20 75 L 80 40 L 220 40 L 280 75 L 220 110 L 80 110 Z" fill="url(#hull-grad)" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="4,2"/>
            <!-- Cockpit Canopy -->
            <path d="M 120 40 L 140 20 L 160 20 L 180 40 Z" fill="rgba(0, 240, 255, 0.15)" stroke="#00f0ff" stroke-width="2"/>
            <!-- Wing Structures -->
            <path d="M 80 40 L 50 15 L 120 40 Z" fill="#0a121f" stroke="#00f0ff" stroke-width="1"/>
            <path d="M 80 110 L 50 135 L 120 110 Z" fill="#0a121f" stroke="#00f0ff" stroke-width="1"/>
            <path d="M 220 40 L 250 15 L 180 40 Z" fill="#0a121f" stroke="#00f0ff" stroke-width="1"/>
            <path d="M 220 110 L 250 135 L 180 110 Z" fill="#0a121f" stroke="#00f0ff" stroke-width="1"/>
            <!-- Neon Detailing Lines -->
            <line x1="80" y1="75" x2="220" y2="75" stroke="url(#neon-glow)" stroke-width="3"/>
            <line x1="100" y1="55" x2="200" y2="55" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.5"/>
            <line x1="100" y1="95" x2="200" y2="95" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.5"/>
            <!-- Thruster Engines (Back) -->
            <rect x="15" y="65" width="10" height="20" fill="#000" stroke="#ff0055" stroke-width="1"/>
            <path class="engine-flame" d="M 15 65 L -10 75 L 15 85 Z" fill="#00f0ff" filter="url(#thruster-blur)"/>
            
            <rect x="35" y="30" width="10" height="15" fill="#000" stroke="#ff0055" stroke-width="1"/>
            <path class="engine-flame" d="M 35 30 L 15 37 L 35 45 Z" fill="#ff0055" filter="url(#thruster-blur)"/>
            
            <rect x="35" y="105" width="10" height="15" fill="#000" stroke="#ff0055" stroke-width="1"/>
            <path class="engine-flame" d="M 35 105 L 15 112 L 35 120 Z" fill="#ff0055" filter="url(#thruster-blur)"/>
            
            <!-- Sensor Dish (Front) -->
            <circle cx="280" cy="75" r="4" fill="#00ff66" filter="url(#thruster-blur)"/>
            <path d="M 284 75 Q 295 60 295 75 Q 295 90 284 75" fill="none" stroke="#00ff66" stroke-width="2" stroke-dasharray="2,2"/>
        </svg>

        <!-- Tractor Beam Title Plate -->
        <div class="tractor-beam-title">
            <h1>THE <span>BACKTEST</span> FACTORY</h1>
        </div>
    </div>

    <!-- ==========================================
         BOTTOM-LEFT MIAMI VICE HANDWRITING
         ========================================== -->
    <div class="vice-text-container">
        <div class="vice-line">Building backtest tools,</div>
        <div class="vice-line">with a cup of tea in hand!</div>
    </div>

    <!-- ==========================================
         CONSTELLATION BEASTS (Parallax & Video Support)
         ========================================== -->
    <div class="constellation bull-constellation">
        <div class="beast-container">
            <img src="bull.png" alt="Bull Constellation" class="beast-img">
            <video class="beast-vid" muted loop playsinline preload="auto">
                <source src="bull.mp4" type="video/mp4">
            </video>
        </div>
    </div>
    
    <div class="constellation bear-constellation">
        <div class="beast-container">
            <img src="bear.png" alt="Bear Constellation" class="beast-img">
            <video class="beast-vid" muted loop playsinline preload="auto">
                <source src="bear.mp4" type="video/mp4">
            </video>
        </div>
    </div>

    <!-- ==========================================
         SOLAR SYSTEM & CAMERA VIEWPORT
         ========================================== -->
    <div id="spaceship-viewport">
        <div id="solar-system">
            <!-- Center BTC Sun -->
            <div id="sun" class="btc-sun" style="background-image: url('btc.png');"></div>

            <!-- Orbit 1: Backtest Machine -->
            <div class="orbit orbit-1">
                <div class="planet" style="background-image: url('backtest.png');">
                    <div class="target-reticle"></div>
                    <div class="planet-label">SEC-01: Backtest</div>
                </div>
            </div>

            <!-- Orbit 2: Databank -->
            <div class="orbit orbit-2">
                <div class="planet" style="background-image: url('databank.png');">
                    <div class="target-reticle"></div>
                    <div class="planet-label">SEC-02: Databank</div>
                </div>
            </div>

            <!-- Orbit 3: About -->
            <div class="orbit orbit-3">
                <div class="planet" style="background-image: url('about.png');">
                    <div class="target-reticle"></div>
                    <div class="planet-label">SEC-03: About</div>
                </div>
            </div>

            <!-- Orbit 4: Contact -->
            <div class="orbit orbit-4">
                <div class="planet" style="background-image: url('contact.png');">
                    <div class="target-reticle"></div>
                    <div class="planet-label">SEC-04: Contact</div>
                </div>
            </div>

            <!-- Orbit 5: Campus -->
            <div class="orbit orbit-5">
                <div class="planet" style="background-image: url('campus.png');">
                    <div class="target-reticle"></div>
                    <div class="planet-label">SEC-05: Campus</div>
                </div>
            </div>
        </div>
    </div>

    <!-- ==========================================
         HUD MODULE OVERLAY (Cinematic Mode)
         ========================================== -->
    <div id="cinematic-overlay">
        <button id="return-btn">
            <i class="fa-solid fa-chevron-left"></i> DISENGAGE
        </button>
        
        <div class="module-details">
            <div class="corner-bracket top-left"></div>
            <div class="corner-bracket top-right"></div>
            <div class="corner-bracket bottom-left"></div>
            <div class="corner-bracket bottom-right"></div>
            
            <span class="module-tag" id="module-tag">SEC-00 // SYSTEM</span>
            <h2 id="module-title">MODULE NAME</h2>
            <div class="stats-grid" id="stats-grid">
                <!-- Stats dynamically injected via JS -->
            </div>
            <p id="module-desc">System description loading...</p>
            
            <button class="action-btn" id="module-action-btn">
                <i class="fa-solid fa-satellite-dish"></i> INITIATE UPLINK
            </button>
        </div>
    </div>

    <!-- GAS GIANT FORM ATMOSPHERE
