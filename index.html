<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System & Backtest Factory</title>
    
    <!-- URL Sanitizer to fix Instagram / Facebook browser routing issues -->
    <script>
        (function() {
            try {
                var url = new URL(window.location.href);
                var params = ['fbclid', 'igshid', 'utm_source', 'utm_medium', 'utm_campaign', 'utm_term', 'utm_content'];
                var hasTracking = false;
                
                params.forEach(function(param) {
                    if (url.searchParams.has(param)) {
                        url.searchParams.delete(param);
                        hasTracking = true;
                    }
                });
                
                var needsSlash = url.pathname === '' && !url.toString().endsWith('/');
                
                if (hasTracking || needsSlash) {
                    if (url.pathname === '') {
                        url.pathname = '/';
                    }
                    window.location.replace(url.toString());
                }
            } catch (e) {
                console.error("URL cleaning failed", e);
            }
        })();
    </script>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@400;600;800&family=Damion&display=swap" rel="stylesheet">
    
    <!-- Supabase JS Client SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* COMPACT EXPANDABLE HUD NAVIGATION STYLES */
        #auth-corner {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }

        .hud-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
            background: rgba(4, 12, 20, 0.95);
            border: 1px solid #00f0ff;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.25), inset 0 0 10px rgba(0, 240, 255, 0.1);
            font-family: 'Share Tech Mono', monospace;
        }

        .hud-slot {
            position: relative;
            display: flex;
            align-items: center;
            height: 38px;
            padding: 0 12px;
            border-radius: 6px;
            background: rgba(6, 18, 30, 0.85);
            border: 1px solid var(--theme-color);
            overflow: hidden;
            cursor: pointer;
            color: var(--theme-color);
            transition: all 0.25s ease-out 0s;
        }

        .hud-slot.agent    { --theme-color: #00ff88; --glow: rgba(0, 255, 136, 0.4); }
        .hud-slot.credits  { --theme-color: #facc15; --glow: rgba(250, 204, 21, 0.4); }
        .hud-slot.subs     { --theme-color: #eab308; --glow: rgba(234, 179, 8, 0.4); }
        .hud-slot.reports  { --theme-color: #38bdf8; --glow: rgba(56, 189, 248, 0.4); }
        .hud-slot.logout   { --theme-color: #f43f5e; --glow: rgba(244, 63, 94, 0.4); }

        .hud-slot::after {
            content: '';
            position: absolute;
            top: 0;
            left: -150%;
            width: 70%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
            transform: skewX(-25deg);
            pointer-events: none;
            transition: none;
        }

        .hud-icon-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 15px;
            flex-shrink: 0;
            z-index: 2;
        }

        .hud-icon-box i {
            transition: transform 0.2s ease-out 0s;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background-color: #00ff88;
            border-radius: 50%;
            box-shadow: 0 0 8px #00ff88;
            flex-shrink: 0;
        }

        .hud-label-box {
            display: block;
            white-space: nowrap;
            opacity: 0;
            max-width: 0; 
            overflow: hidden;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: -1px;
            transform: scale(0.9);
            margin-left: 0;
            z-index: 2;
            transition: max-width 0.25s ease-out 0s,
                        opacity 0.2s ease-out 0s,
                        margin-left 0.2s ease-out 0s,
                        transform 0.2s ease-out 0s,
                        letter-spacing 0.2s ease-out 0s;
        }

        .hud-slot:hover {
            box-shadow: 0 0 18px var(--glow), inset 0 0 10px var(--glow);
            background: rgba(8, 28, 44, 0.95);
            transition: all 0.3s ease 0.2s;
        }

        .hud-slot:hover::after {
            left: 200%;
            transition: left 0.65s cubic-bezier(0.4, 0, 0.2, 1) 0.2s;
        }

        .hud-slot:hover .hud-icon-box i {
            transform: scale(1.15) rotate(-5deg);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s;
        }

        .hud-slot:hover .hud-label-box {
            opacity: 1;
            max-width: 250px;
            margin-left: 8px;
            letter-spacing: 0.8px;
            transform: scale(1);
            transition: max-width 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s,
                        opacity 0.3s ease 0.2s,
                        margin-left 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s,
                        transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s,
                        letter-spacing 0.4s ease 0.2s;
        }

        .vice-text-container {
            position: fixed;
            z-index: 999;
            pointer-events: none;
            user-select: none;
            display: flex;
            flex-direction: column;
        }

        .vice-text-container.vice-right {
            bottom: 40px;
            right: 50px;
            align-items: flex-end;
            text-align: right;
        }

        .vice-text-container.vice-left {
            bottom: 40px;
            left: 50px;
            align-items: flex-start;
            text-align: left;
            max-width: 700px;
        }

        .vice-line {
            font-family: 'Damion', cursive;
            font-size: 1.3rem; 
            letter-spacing: 1px;
            line-height: 1.15;
            white-space: nowrap;
            -webkit-text-stroke: 0.8px rgba(255, 255, 255, 0.7);
            padding-right: 40px;
            padding-bottom: 20px;
            padding-top: 10px;
            margin-bottom: -15px; 
            opacity: 0;
            clip-path: inset(-40px 100% -40px -40px);
        }

        .vice-left .vice-line {
            font-size: 1.45rem;
            letter-spacing: 1.2px;
            line-height: 1.3;
            -webkit-text-stroke: 0.3px rgba(255, 255, 255, 0.9);
            margin-bottom: 2px;
            padding-right: 40px;
        }

        .vice-line.cyan {
            color: #00f0ff;
            text-shadow: 0 0 2px #fff, 0 0 8px #00f0ff, 0 0 15px #00a8ff;
        }

        .vice-line.pink {
            color: #ff007f;
            text-shadow: 0 0 2px #fff, 0 0 8px #ff007f, 0 0 15px #ff0055;
        }

        .vice-line.yellow {
            color: #ffe600;
            text-shadow: 0 0 2px #fff, 0 0 8px #ffe600, 0 0 15px #ff9900;
        }
    </style>
</head>
<body>

    <div id="auth-corner">
        <div class="hud-bar">
            <div class="hud-slot agent" id="nav-agent-btn">
                <div class="hud-icon-box">
                    <span class="status-dot"></span>
                    <i class="fa-solid fa-user-shield"></i>
                </div>
                <div class="hud-label-box">
                    <span id="nav-user-label">AGENT: DR.ALI.G</span>
                </div>
            </div>

            <div class="hud-slot credits" id="nav-credits-btn">
                <div class="hud-icon-box">
                    <i class="fa-solid fa-coins"></i>
                </div>
                <div class="hud-label-box">
                    <span id="nav-credits-label">CREDITS: 83</span>
                </div>
            </div>

            <div class="hud-slot subs" id="nav-subscription-btn">
                <div class="hud-icon-box">
                    <i class="fa-solid fa-gem"></i>
                </div>
                <div class="hud-label-box">
                    <span>SUBSCRIPTIONS</span>
                </div>
            </div>

            <div class="hud-slot reports" id="nav-reports-btn">
                <div class="hud-icon-box">
                    <i class="fa-solid fa-folder-open"></i>
                </div>
                <div class="hud-label-box">
                    <span>MY REPORTS</span>
                </div>
            </div>

            <div class="hud-slot logout" id="nav-logout-btn">
                <div class="hud-icon-box">
                    <i class="fa-solid fa-power-off"></i>
                </div>
                <div class="hud-label-box">
                    <span>LOGOUT</span>
                </div>
            </div>
        </div>
    </div>

    <div class="vice-text-container vice-right">
        <div class="vice-line cyan" id="vice-right-1"></div>
        <div class="vice-line pink" id="vice-right-2"></div>
        <div class="vice-line yellow" id="vice-right-3"></div>
    </div>

    <div class="vice-text-container vice-left">
        <div class="vice-line pink" id="vice-left-1"></div>
        <div class="vice-line pink" id="vice-left-2"></div>
    </div>

    <div id="space-matrix">
        <canvas id="blackboard-bg"></canvas>
        <div class="tactical-grid"></div>
        <div class="stars"></div>

        <div class="constellation bull-constellation">
            <div class="beast-container">
                <img src="images/bull-pattern.png" alt="Taurus" class="beast-img">
                <video muted playsinline class="beast-vid">
                    <source src="images/bull-animated.webm" type="video/webm">
                    <source src="images/bull-animated.mp4" type="video/mp4">
                </video>
            </div>
        </div>
        
        <div class="constellation bear-constellation">
            <div class="beast-container">
                <img src="images/bear-pattern.png" alt="Ursa" class="beast-img">
                <video muted playsinline class="beast-vid">
                    <source src="images/bear-animated.webm" type="video/webm">
                    <source src="images/bear-animated.mp4" type="video/mp4">
                </video>
            </div>
        </div>
    </div>

    <div id="spaceship-title-container">
        <svg class="mothership-svg" viewBox="0 0 220 100" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="shipHull" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#040912" />
                    <stop offset="50%" stop-color="#121e2d" />
                    <stop offset="100%" stop-color="#040912" />
                </linearGradient>
                <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="4" result="blur" />
                    <feComposite in="SourceGraphic" in2="blur" operator="over" />
                </filter>
                <filter id="magentaGlow" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="6" result="blur" />
                    <feComposite in="SourceGraphic" in2="blur" operator="over" />
                </filter>
            </defs>
            <polygon class="engine-flame" points="25,43 -10,50 25,57" fill="#ff0055" filter="url(#magentaGlow)"/>
            <path d="M45,35 L15,10 L75,38 Z" fill="#040912" stroke="#00f0ff" stroke-width="1"/>
        </svg>
        <div class="mobile-reliability-text">Test the reliability of your system...</div>
    </div>
</body>
</html>
