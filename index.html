<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>System & Backtest Factory</title>
  <link rel="stylesheet" href="style.css">
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- Background Space Layer -->
  <div class="space-bg"></div>

  <!-- Beast Constellation Canvases (Desktop Only) -->
  <canvas id="bullCanvas" class="constellation-canvas beast-layer"></canvas>
  <canvas id="bearCanvas" class="constellation-canvas beast-layer"></canvas>

  <!-- Navigation / Mothership Title -->
  <header class="mothership-header">
    <h1 class="mothership-title">SYSTEM & BACKTEST FACTORY</h1>
  </header>

  <!-- Auth / User Profile HUD Corner -->
  <div id="user-hud" class="user-hud-container">
    <div id="auth-logged-out" class="auth-box">
      <button id="btn-login" class="hud-btn">LOG IN / REGISTER</button>
    </div>
    <div id="auth-logged-in" class="auth-box hidden">
      <span id="user-email" class="user-email-text">user@example.com</span>
      <span id="user-credits" class="credits-badge">Credits: 0</span>
      <button id="btn-logout" class="hud-btn logout-btn">LOG OUT</button>
    </div>
  </div>

  <!-- Main Solar System Container (Centered on Phone & Desktop) -->
  <main class="solar-system-container" id="solar-system">
    
    <!-- Central Sun / Core Hub -->
    <div class="sun-core" id="sun-hub">
      <div class="sun-glow"></div>
      <span class="sun-label">CORE HUB</span>
    </div>

    <!-- Planet 1: Backtesting Campus -->
    <div class="orbit-ring orbit-1">
      <div class="planet planet-campus" id="planet-campus" data-module="campus">
        <div class="planet-sphere"></div>
        <span class="planet-label">Campus</span>
      </div>
    </div>

    <!-- Planet 2: Backtest Machine -->
    <div class="orbit-ring orbit-2">
      <div class="planet planet-machine" id="planet-machine" data-module="machine">
        <div class="planet-sphere"></div>
        <span class="planet-label">Backtest Machine</span>
      </div>
    </div>

    <!-- Planet 3: System Databank -->
    <div class="orbit-ring orbit-3">
      <div class="planet planet-databank" id="planet-databank" data-module="databank">
        <div class="planet-sphere"></div>
        <span class="planet-label">Databank</span>
      </div>
    </div>

  </main>

  <!-- Interactive HUD Modals -->
  <div id="modal-container" class="modal-overlay hidden">
    <div class="modal-card">
      <button id="modal-close" class="modal-close-btn">&times;</button>
      <div id="modal-content-area">
        <!-- Dynamic module content renders here -->
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
