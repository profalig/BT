<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyberpunk HUD - Candlestick Expansion</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background-color: #030712;
      background-image: 
        linear-gradient(to right, rgba(0, 240, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
      background-size: 30px 30px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Share Tech Mono', monospace;
      color: #fff;
    }

    /* Outer HUD Container (Original Design Frame) */
    .hud-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      background: rgba(4, 12, 20, 0.95);
      border: 1px solid #00f0ff;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.25), inset 0 0 10px rgba(0, 240, 255, 0.1);
    }

    /* Navigation Slot / Item Wrapper */
    .hud-slot {
      position: relative;
      display: flex;
      align-items: center;
      height: 40px;
      border-radius: 6px;
      background: rgba(6, 18, 30, 0.85);
      border: 1px solid var(--theme-color);
      overflow: hidden;
      cursor: pointer;
      transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Color Definitions matching original panel */
    .hud-slot.agent    { --theme-color: #00ff88; --glow: rgba(0, 255, 136, 0.4); }
    .hud-slot.credits  { --theme-color: #facc15; --glow: rgba(250, 204, 21, 0.4); }
    .hud-slot.subs     { --theme-color: #eab308; --glow: rgba(234, 179, 8, 0.4); }
    .hud-slot.reports  { --theme-color: #38bdf8; --glow: rgba(56, 189, 248, 0.4); }
    .hud-slot.logout   { --theme-color: #f43f5e; --glow: rgba(244, 63, 94, 0.4); }

    /* Default (Idle): Candlestick Trigger Display */
    .candle-trigger {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      min-width: 44px;
      height: 100%;
      padding: 0 10px;
      transition: opacity 0.2s ease;
    }

    .candle {
      width: 4px;
      position: relative;
      border-radius: 1px;
    }

    .candle::before, .candle::after {
      content: '';
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 1px;
      background: currentColor;
    }

    .candle.green { background: #00ff88; color: #00ff88; }
    .candle.red   { background: #f43f5e; color: #f43f5e; }

    .c-sm { height: 10px; } .c-sm::before { top: -2px; height: 2px; } .c-sm::after { bottom: -2px; height: 2px; }
    .c-md { height: 16px; } .c-md::before { top: -3px; height: 3px; } .c-md::after { bottom: -2px; height: 2px; }
    .c-lg { height: 22px; } .c-lg::before { top: -2px; height: 2px; } .c-lg::after { bottom: -3px; height: 3px; }

    /* Hidden Text Panel Content */
    .panel-content {
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      opacity: 0;
      max-width: 0;
      padding-right: 0;
      color: var(--theme-color);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.5px;
      transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Status Dot & Icons */
    .status-dot {
      width: 7px;
      height: 7px;
      background-color: #00ff88;
      border-radius: 50%;
      box-shadow: 0 0 8px #00ff88;
      flex-shrink: 0;
    }

    .icon {
      width: 16px;
      height: 16px;
      fill: currentColor;
      flex-shrink: 0;
    }

    /* HOVER EFFECT: Expand Candlestick into Original Panel Button */
    .hud-slot:hover {
      box-shadow: 0 0 15px var(--glow), inset 0 0 8px var(--glow);
      background: rgba(10, 30, 48, 0.95);
    }

    .hud-slot:hover .candle-trigger {
      opacity: 0.4;
    }

    .hud-slot:hover .panel-content {
      opacity: 1;
      max-width: 200px;
      padding-right: 14px;
    }
  </style>
</head>
<body>

  <!-- Cyberpunk HUD Bar -->
  <div class="hud-bar">
    
    <!-- 1. AGENT -->
    <div class="hud-slot agent">
      <div class="candle-trigger">
        <div class="candle green c-sm"></div>
        <div class="candle green c-lg"></div>
        <div class="candle red c-md"></div>
      </div>
      <div class="panel-content">
        <span class="status-dot"></span>
        <svg class="icon" viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8s0 .01 0 .01z"/></svg>
        <span>AGENT: DR.ALI.G</span>
      </div>
    </div>

    <!-- 2. CREDITS -->
    <div class="hud-slot credits">
      <div class="candle-trigger">
        <div class="candle green c-lg"></div>
        <div class="candle red c-sm"></div>
        <div class="candle green c-md"></div>
      </div>
      <div class="panel-content">
        <svg class="icon" viewBox="0 0 24 24"><path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.11 0-2-.9-2-2V5c0-1.1.89-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.11 0-2 .9-2 2v8c0 1.1.89 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
        <span>CREDITS: 83</span>
      </div>
    </div>

    <!-- 3. SUBSCRIPTIONS -->
    <div class="hud-slot subs">
      <div class="candle-trigger">
        <div class="candle red c-md"></div>
        <div class="candle green c-sm"></div>
        <div class="candle green c-lg"></div>
      </div>
      <div class="panel-content">
        <svg class="icon" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        <span>SUBSCRIPTIONS</span>
      </div>
    </div>

    <!-- 4. MY REPORTS -->
    <div class="hud-slot reports">
      <div class="candle-trigger">
        <div class="candle green c-md"></div>
        <div class="candle green c-lg"></div>
        <div class="candle red c-sm"></div>
      </div>
      <div class="panel-content">
        <svg class="icon" viewBox="0 0 24 24"><path d="M20 6h-8l-2-2H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 12H4V8h16v10z"/></svg>
        <span>MY REPORTS</span>
      </div>
    </div>

    <!-- 5. LOGOUT -->
    <div class="hud-slot logout">
      <div class="candle-trigger">
        <div class="candle red c-lg"></div>
        <div class="candle red c-sm"></div>
      </div>
      <div class="panel-content">
        <svg class="icon" viewBox="0 0 24 24"><path d="M13 3h-2v10h2V3zm4.83 2.17l-1.42 1.42C17.99 7.86 19 9.81 19 12c0 3.87-3.13 7-7 7s-7-3.13-7-7c0-2.19 1.01-4.14 2.58-5.42L6.17 5.17C4.23 6.82 3 9.26 3 12c0 4.97 4.03 9 9 9s9-4.03 9-9c0-2.74-1.23-5.18-3.17-6.83z"/></svg>
        <span>LOGOUT</span>
      </div>
    </div>

  </div>

</body>
</html>
